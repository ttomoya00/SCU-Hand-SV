description: Laboratory automation for solid-state materials discovery demands powder handling across diverse experimental conditions and a wide weighing range; to address this, we propose the SCU-Hand-SV, a soft robotic hand with a controllable valve, achieving dispensing within ±2 mg accuracy across a range of 20 mg to 3000 mg for multiple powder types through model-based feedback control.
